[package]
name = "jimmy"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axe = { git = "https://github.com/3-lines-studio/axe", rev = "3ae9c9793e868cc4c90908b9d345ba51fe97a5bb", default-features = false }
heimdall = { git = "https://github.com/3-lines-studio/heimdall", rev = "2e7fc8ca37c137007a0cee0338e9d35ca6d3c4dd" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "2"
