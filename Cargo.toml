[package]
name = "jimmy"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axe = { git = "https://github.com/3-lines-studio/axe", rev = "3ae9c9793e868cc4c90908b9d345ba51fe97a5bb", default-features = false }
heimdall = { git = "https://github.com/3-lines-studio/heimdall", rev = "2c504ed9a6184bfa15923c8e9b1aabf5af36ab1f" }
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "2"
