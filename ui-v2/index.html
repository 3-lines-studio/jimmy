<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Jimmy</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0e11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jimmy" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/avatar.css" />
    <link rel="stylesheet" href="/vault.css" />
    <link rel="stylesheet" href="/v2/app.css" />
    <script>
      (() => {
        const saved = localStorage.getItem("jimmy-theme");
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="main"></div>
    <script type="module">
      import init from "/v2/ui-v2.js";
      await init();
    </script>
  </body>
</html>
