<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Jimmy</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0e11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jimmy" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/avatar.css" />
    <link rel="stylesheet" href="/vault.css" />
    <link rel="stylesheet" href="/v2/app.css" />
    <style>
      #v2-fallo {
        margin: 16px;
        padding: 12px 14px;
        border: 1px solid #4a2b2b;
        border-radius: 10px;
        background: #1a1214;
        color: #f5c2c2;
        font: 13px/1.5 system-ui, sans-serif;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #v2-fallo a {
        color: #f5c2c2;
      }
    </style>
    <script>
      (() => {
        const saved = localStorage.getItem("jimmy-theme");
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      })();

      window.jimmyFallo = (motivo) => {
        let box = document.getElementById("v2-fallo");
        if (!box) {
          box = document.createElement("div");
          box.id = "v2-fallo";
          document.body.append(box);
        }
        box.textContent =
          "La v2 no arrancó: " +
          motivo +
          "\n\n" +
          navigator.userAgent +
          "\n\nVolver a la v1: " +
          location.origin +
          "/";
      };

      addEventListener("error", (event) => {
        if (event.message) window.jimmyFallo(event.message);
      });
      addEventListener("unhandledrejection", (event) => {
        window.jimmyFallo(String((event.reason && event.reason.message) || event.reason));
      });
      setTimeout(() => {
        if (!document.querySelector("#main > *")) window.jimmyFallo("no montó nada en 8 segundos");
      }, 8000);
    </script>
  </head>
  <body>
    <div id="main"></div>
    <script type="module">
      import init from "/v2/ui-v2.js";
      try {
        await init();
      } catch (error) {
        window.jimmyFallo("no cargó el wasm: " + (error && error.message ? error.message : error));
      }
    </script>
  </body>
</html>
