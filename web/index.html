<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jimmy</title>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/style.css" />
    <script>
      (() => {
        const saved = localStorage.getItem("jimmy-theme");
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="backdrop" hidden></div>
      <aside id="sidebar">
        <header>
          <strong>Jimmy</strong>
          <div id="header-actions">
            <button id="theme"></button>
            <form id="logout" method="post" action="/api/logout"><button>salir</button></form>
          </div>
        </header>
        <div id="online"></div>
        <div id="sidebar-search">
          <div class="field">
            <input id="search" placeholder="buscar en el historial" spellcheck="false" />
          </div>
        </div>
        <nav id="projects"></nav>
        <div id="sidebar-actions">
          <input id="project-name" placeholder="nombre del proyecto" spellcheck="false" />
          <button id="new-project">agregar proyecto</button>
        </div>
      </aside>

      <main>
        <div id="tabbar">
          <button id="menu" aria-label="proyectos"></button>
          <div id="tabs"></div>
          <div id="tab-actions" hidden>
            <span id="viewers"></span>
            <button id="cancel">cancelar</button>
          </div>
        </div>
        <div id="panes">
          <div id="placeholder">Elegí una conversación, o creá una nueva.</div>
        </div>
        <form id="composer" hidden>
          <div id="typing" hidden></div>
          <div id="pending" hidden></div>
          <div class="box">
            <label id="attach" title="adjuntar imagen">
              <input id="file" type="file" accept="image/*" multiple hidden />
            </label>
            <textarea id="input" rows="1" placeholder="Escribí un mensaje…"></textarea>
            <button class="send" aria-label="enviar"></button>
          </div>
        </form>
      </main>
      <div id="toast" hidden></div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
