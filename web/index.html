<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jimmy</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="backdrop" hidden></div>
      <aside id="sidebar">
        <header>
          <strong>Jimmy</strong>
          <form id="logout" method="post" action="/api/logout"><button>salir</button></form>
        </header>
        <nav id="projects"></nav>
      </aside>

      <main>
        <div id="tabbar">
          <button id="menu" aria-label="proyectos">☰</button>
          <div id="tabs"></div>
        </div>
        <div id="panes">
          <div id="placeholder">Elegí una conversación, o creá una nueva.</div>
        </div>
        <form id="composer" hidden>
          <div class="box">
            <textarea id="input" rows="1" placeholder="Escribí un mensaje…"></textarea>
            <button class="send">enviar</button>
          </div>
        </form>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
