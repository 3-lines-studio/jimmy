<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Jimmy</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0e11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jimmy" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/avatar.css" />
    <script>
      (() => {
        const saved = localStorage.getItem("jimmy-theme");
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="orgs">
          <select id="org" aria-label="Organización"></select>
          <button id="new-org" aria-label="Nueva organización" title="Nueva organización">+</button>
        </div>
        <form id="new-org-form" hidden>
          <input
            id="org-name"
            placeholder="Nueva organización"
            aria-label="Nueva organización"
            spellcheck="false"
          />
        </form>
        <form id="new-project">
          <input
            id="project-name"
            placeholder="Nuevo proyecto"
            aria-label="Nuevo proyecto"
            spellcheck="false"
          />
          <button aria-label="Agregar proyecto" title="Agregar proyecto"></button>
        </form>
        <div id="online"></div>
        <nav id="projects"></nav>
        <div id="chips">
          <button id="agenda" aria-label="Agenda">
            <span class="label">Agenda</span>
            <span id="agenda-badge" hidden></span>
          </button>
          <div id="previews" hidden></div>
        </div>
        <div id="base">
          <div id="machine" hidden></div>
          <div id="footer">
            <button id="theme"></button>
            <form id="logout" method="post" action="/api/logout"><button aria-label="Salir" title="Salir"></button></form>
          </div>
        </div>
      </aside>

      <main>
        <div id="tabbar">
          <button id="menu" aria-label="Volver" title="Volver"></button>
          <div id="tabs"></div>
          <div id="tab-actions" hidden>
            <span id="viewers"></span>
            <button id="cancel">Cancelar</button>
          </div>
        </div>
        <div id="refresh" hidden></div>
        <div id="panes">
          <div id="placeholder">Elegí una conversación o creá una nueva.</div>
        </div>
        <form id="composer" hidden>
          <div id="typing" hidden></div>
          <div id="pending" hidden></div>
          <div class="box">
            <textarea id="input" rows="1" placeholder="Escribí un mensaje…"></textarea>
            <label id="attach" title="Adjuntar imagen">
              <input id="file" type="file" accept="image/*" multiple hidden />
            </label>
            <button class="send" aria-label="Enviar"></button>
          </div>
        </form>
      </main>
      <div id="toast" hidden></div>
    </div>

    <script src="/markdown.js"></script>
    <script src="/tool.js"></script>
    <script src="/machine.js"></script>
    <script src="/files.js"></script>
    <script src="/project.js"></script>
    <script src="/avatar.js"></script>
    <script src="/agenda.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
